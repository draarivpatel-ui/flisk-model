name: GEL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # weekly, so the dashboard record never expires (artifacts last 30 days)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gel-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gel:
    permissions: { contents: read, checks: read, pull-requests: read }
    uses: flisk-sh/gel/.github/workflows/gel.yml@1be250eb318de025602a37eb32e50fb6d5913199 # v1.17.0
    with: { gel_ref: 1be250eb318de025602a37eb32e50fb6d5913199 }
